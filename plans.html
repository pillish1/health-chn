<head>
<meta charset="UTF-8">

</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search"><i class="ic" data-icon="search"></i> 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的"><i class="ic" data-icon="user"></i></button>
  </div>
</div>

<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">
  <div style="text-align:center">
    <img src="icons/icon-192.png" alt="悦动健康" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite">
    <div style="margin-top:12px;color:var(--muted);font-size:.85rem">加载中…</div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }</style>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康 logo"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="plans.html">健康追踪</a>
      <a href="plans.html">运动记录</a>
      <a href="foods.html">食物热量</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题"><i class="ic" data-icon="moon"></i></button>
      <button class="icon-btn nav-toggle" id="navToggle" title="菜单"><i class="ic" data-icon="menu"></i></button>
    </div>
  </div>
</nav>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">首页</a><span>›</span><span>运动记录</span></div>
    <h1><i class="ic" data-icon="run"></i> 运动记录</h1>
    <p>记录你今天的运动，这里会给你合适的建议</p>
  </div>
</header>

<section class="section-sm">
  <div class="container">
    <!-- 训练记录（卡片式） -->
    <div class="card mb-3">
      <div class="flex-between" style="margin-bottom:14px">
        <div class="card-title" style="margin:0"><i class="ic" data-icon="workout"></i> 我的训练记录</div>
        <button class="btn btn-primary btn-sm" id="btnAddWorkout" type="button">＋ 添加训练</button>
      </div>
      <p class="small muted mb-2" style="margin-top:0">记录每次训练：练了什么部位、做了什么动作、几组几次</p>
      <div id="workoutList"></div>
      <div id="workoutEmpty" class="empty hidden"><div class="e-icon"><i class="ic" data-icon="dumbbell"></i></div><div class="e-title">还没有训练记录</div><div class="e-desc">点右上角「添加训练」，记下今天的训练</div></div>
    </div>

    <!-- 添加训练弹窗（点选动作模式） -->
    <div class="modal-overlay" id="addWorkoutModal">
      <div class="modal" style="max-width:520px">
        <div class="modal-title"><i class="ic" data-icon="dumbbell"></i> 添加训练</div>
        <div class="modal-sub">点选今天练了哪些动作</div>
        <div class="field" id="wkFavField">
          <label>⭐ 我的收藏（点击快速添加）</label>
          <div class="wk-fav-list" id="wkFavList"></div>
        </div>
        <div class="field">
          <label>训练日期</label>
          <input class="input" type="date" id="wkDate">
        </div>
        <div class="field">
          <label>① 选择部位</label>
          <div class="wk-muscle-chips" id="wkMuscleGroup"></div>
        </div>
        <div class="field">
          <label>② 点选动作（可多选）</label>
          <div class="wk-action-grid" id="wkActionGrid"></div>
        </div>
        <div class="field">
          <label>③ 已选动作 · 组数×次数</label>
          <div id="wkSelected"></div>
        </div>
        <div class="field">
          <label>训练时长（分钟，可选）</label>
          <input class="input" type="number" id="wkMinutes" min="0" max="600" placeholder="如：60" inputmode="numeric">
        </div>
        <div class="flex gap-sm mt-2">
          <button class="btn btn-ghost" style="flex:1" onclick="window.YDJK_UI.closeModal('addWorkoutModal')">取消</button>
          <button class="btn btn-primary" id="btnSaveWorkout" style="flex:1">保存训练</button>
        </div>
      </div>
    </div>

    <!-- 本周运动概览 -->
    <div class="card mb-3">
      <div class="card-title"><i class="ic" data-icon="stats"></i> 本周运动概览</div>
      <div class="stat-grid" id="weekWorkoutStats">
        <div class="stat-card blue"><div class="s-icon"><i class="ic" data-icon="calendar"></i></div><div class="s-value" id="wsDays">--</div><div class="s-label">运动天数</div></div>
        <div class="stat-card green"><div class="s-icon">⏱️</div><div class="s-value" id="wsMinutes">--</div><div class="s-label">总时长(分)</div></div>
        <div class="stat-card orange"><div class="s-icon"><i class="ic" data-icon="flame"></i></div><div class="s-value" id="wsStreak">--</div><div class="s-label">连续天数</div></div>
      </div>
      <div class="small muted mt-2" id="weekWorkoutDetail"></div>
    </div>

    <!-- 运动日历（历史记录） -->
    <div class="card mb-3">
      <div class="flex-between" style="margin-bottom:10px">
        <div class="card-title" style="margin:0"><i class="ic" data-icon="calendar"></i> 运动日历</div>
        <div class="cal-nav">
          <button id="calPrev" title="上个月" aria-label="上个月">‹</button>
          <span class="small muted" id="monthLabel" style="min-width:90px;text-align:center"></span>
          <button id="calNext" title="下个月" aria-label="下个月">›</button>
        </div>
      </div>
      <div id="calHeatmap"></div>
    </div>

    <!-- 运动建议（基于记录生成） -->
    <div class="card mb-3" id="suggestCard">
      <div class="card-title"><i class="ic" data-icon="tip"></i> 运动建议</div>
      <div id="suggestBody" class="text-2" style="font-size:.92rem;line-height:1.8">
        <p style="margin:0">开始记录运动后，这里会根据你的运动习惯给出建议 <i class="ic" data-icon="workout"></i></p>
      </div>
    </div>
  </div>
</section>
