<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>运动记录 · 悦动健康</title>
<meta name="description" content="自由记录你的每一次运动，获取个性化的运动建议。">
<meta name="theme-color" content="#2563eb">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="悦动健康">
<link rel="stylesheet" href="assets/css/style.css?v=73">
<meta property="og:type" content="website">
<meta property="og:title" content="运动记录 · 悦动健康">
<meta property="og:image" content="icons/icon-512.png">
<meta name="twitter:card" content="summary">
</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search">🔍 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的">👤</button>
  </div>
</div>

<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">
  <div style="text-align:center">
    <img src="icons/icon-192.png" alt="悦动健康" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite">
    <div style="margin-top:12px;color:var(--muted);font-size:.85rem">加载中…</div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }</style>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康 logo"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="plans.html">健康追踪</a>
      <a href="plans.html">运动记录</a>
      <a href="foods.html">食物热量</a>
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
      <button class="icon-btn nav-toggle" id="navToggle" title="菜单">☰</button>
    </div>
  </div>
</nav>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">首页</a><span>›</span><span>运动记录</span></div>
    <h1>🏃 运动记录</h1>
    <p>记录你今天的运动，这里会给你合适的建议</p>
  </div>
</header>

<section class="section-sm">
  <div class="container">
    <!-- 今日运动记录（自由记录） -->
    <div class="card mb-3">
      <div class="flex-between" style="margin-bottom:14px">
        <div class="card-title" style="margin:0">💪 今天做了什么运动？</div>
        <span class="small muted" id="exerciseDate"></span>
      </div>
      <p class="small muted mb-2" style="margin-top:0">自由选择，想记多少记多少，记录后生成你的专属建议</p>
      <div id="workoutTypes" class="flex gap-sm flex-wrap" style="margin-bottom:16px"></div>
      <div class="field" style="margin-bottom:12px">
        <label class="small">运动时长（分钟）</label>
        <div class="range-wrap">
          <input type="range" id="workoutMinutes" min="0" max="300" value="30" step="5">
          <span class="range-val" id="workoutMinutesVal">30 分钟</span>
        </div>
      </div>
      <div class="field" style="margin-bottom:14px">
        <label class="small">备注（可选）</label>
        <input class="input" id="workoutNote" placeholder="如：跑步 5 公里，感觉不错…" maxlength="50">
      </div>
      <div class="flex gap-sm">
        <button class="btn btn-primary btn-sm" id="saveWorkout" style="flex:1">✅ 记录今日运动</button>
        <button class="btn btn-ghost btn-sm" id="clearWorkout" style="flex:none">清空</button>
      </div>
    </div>

    <!-- 本周运动概览 -->
    <div class="card mb-3">
      <div class="card-title">📊 本周运动概览</div>
      <div class="stat-grid" id="weekWorkoutStats">
        <div class="stat-card blue"><div class="s-icon">📅</div><div class="s-value" id="wsDays">--</div><div class="s-label">运动天数</div></div>
        <div class="stat-card green"><div class="s-icon">⏱️</div><div class="s-value" id="wsMinutes">--</div><div class="s-label">总时长(分)</div></div>
        <div class="stat-card orange"><div class="s-icon">🔥</div><div class="s-value" id="wsStreak">--</div><div class="s-label">连续天数</div></div>
      </div>
      <div class="small muted mt-2" id="weekWorkoutDetail"></div>
    </div>

    <!-- 运动日历（历史记录） -->
    <div class="card mb-3">
      <div class="flex-between" style="margin-bottom:10px">
        <div class="card-title" style="margin:0">📅 运动日历</div>
        <div class="cal-nav">
          <button id="calPrev" title="上个月" aria-label="上个月">‹</button>
          <span class="small muted" id="monthLabel" style="min-width:90px;text-align:center"></span>
          <button id="calNext" title="下个月" aria-label="下个月">›</button>
        </div>
      </div>
      <div id="calHeatmap"></div>
    </div>

    <!-- 运动建议（基于记录生成） -->
    <div class="card mb-3" id="suggestCard">
      <div class="card-title">💡 运动建议</div>
      <div id="suggestBody" class="text-2" style="font-size:.92rem;line-height:1.8">
        <p style="margin:0">开始记录运动后，这里会根据你的运动习惯给出建议 💪</p>
      </div>
    </div>

    <!-- 动作参考库 -->
    <div class="card">
      <div class="card-title">🧭 运动参考</div>
      <p class="small muted mb-2" style="margin-top:0">不知道做什么运动？看看这些常见动作，点击查看要领</p>
      <div class="search-box" style="margin-bottom:12px">
        <span class="s-ico">🔍</span>
        <input class="input" id="actionSearch" placeholder="搜索动作，如：深蹲、卧推…">
      </div>
      <div class="tabs" id="muscleTabs" style="margin-bottom:14px"></div>
      <div class="grid grid-3" id="actionGrid"></div>
    </div>
  </div>
</section>

<!-- 动作详情弹窗 -->
<div class="modal-overlay" id="actionModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-title" id="amTitle"></div>
    <div class="modal-sub" id="amMeta"></div>
    <div class="mt-2 text-2" id="amDesc" style="line-height:1.8"></div>
  </div>
</div>

<script src="assets/js/supabase-config.js?v=73"></script>
<script src="assets/js/storage.js?v=73"></script>
<script src="assets/js/data.js?v=73"></script>
<script src="assets/js/charts.js?v=73"></script>
<script src="assets/js/app.js?v=73"></script>
<script src="assets/js/pages/plans.js?v=73"></script>

<!-- 底部 Tab 导航（移动端 App 式） -->
<nav class="tab-bar">
  <a class="tab-item" data-tab="home" href="index.html"><span class="tab-ico">🏠</span><span class="tab-lbl">首页</span></a>
  <a class="tab-item" data-tab="foods" href="foods.html"><span class="tab-ico">🍽️</span><span class="tab-lbl">饮食</span></a>
  <a class="tab-item" data-tab="plans" href="plans.html"><span class="tab-ico">💪</span><span class="tab-lbl">运动</span></a>
  <a class="tab-item" data-tab="profile" href="profile.html"><span class="tab-ico">👤</span><span class="tab-lbl">我的</span></a>
</nav>

<style>
.tab-bar{display:none}
@media(max-width:900px){
  .tab-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:150;
    display:flex;align-items:center;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(14px);
  }
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--muted);font-size:.68rem;font-weight:700;text-decoration:none;border-radius:12px;transition:color .2s}
  .tab-item .tab-ico{font-size:1.25rem;line-height:1}
  .tab-item.active{color:var(--primary)}
  .tab-plus{
    width:52px;height:52px;border-radius:50%;border:none;margin-top:-22px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:1.6rem;
    box-shadow:0 8px 24px rgba(139,92,246,.45);display:grid;place-items:center;cursor:pointer;
    transition:transform .2s;
  }
  .tab-plus:active{transform:scale(.92)}
  body{padding-bottom:64px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .quick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface-2);cursor:pointer;transition:all .2s}
  .quick-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
  .qb-ico{font-size:1.8rem}
  .quick-btn b{font-size:.9rem}
  .quick-btn small{font-size:.7rem;color:var(--muted)}
}
</style>
</body>
</html>
