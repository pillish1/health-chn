<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">

  </div>
</div>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">首页</a><span>›</span><span>健康知识</span></div>
    <div class="flex-between flex-wrap" style="align-items:flex-end">
      <div>
        <h1>📖 健康知识库</h1>
        <p>训练、营养、恢复的科学干货。内容仅供科普参考，具体问题请咨询专业人士。</p>
      </div>
      <div class="flex gap-sm" style="gap:10px">
        <button class="btn btn-primary btn-sm" id="publishBtn" style="display:none" onclick="location.href='publish.html'">📝 发布文章</button>
        <button class="btn btn-outline btn-sm" id="manageArticlesBtn">✍️ 本地管理</button>
      </div>
    </div>
  </div>
</header>

<section class="section-sm">
  <div class="container">
    <div class="kb-head">
      <div class="kb-head-text">
        <h1 style="font-size:1.6rem;font-weight:900">📖 健康知识</h1>
        <p class="muted small" style="margin-top:4px">科学健身干货 · 每日更新</p>
      </div>
      <div class="search-box" style="margin:0;flex:1;max-width:340px">
        <span class="s-ico">🔍</span>
        <input class="input" id="articleSearch" placeholder="搜索健康知识…">
      </div>
    </div>
    <div class="kb-layout">
      <div class="kb-main">
        <div class="kb-toolbar">
          <div class="kb-sort" id="kbSort">
            <button class="kb-sort-btn active" data-sort="smart">✨ 推荐</button>
            <button class="kb-sort-btn" data-sort="new">🕐 最新</button>
            <button class="kb-sort-btn" data-sort="hot">🔥 热门</button>
          </div>
        </div>
        <div id="articleList" class="kb-list"></div>
      </div>
      <aside class="kb-side">
        <div class="kb-card">
          <div class="kb-card-title">🌟 今日推荐</div>
          <div id="sidePick"></div>
        </div>
        <div class="kb-card">
          <div class="kb-card-title">🔥 热门排行</div>
          <div id="sideHot"></div>
        </div>
        <div class="kb-card">
          <div class="kb-card-title">🏷️ 分类</div>
          <div id="sideCats"></div>
        </div>
      </aside>
    </div>
  </div>
</section>

<!-- 阅读弹窗 -->
<div class="modal-overlay" id="readModal">
  <div class="modal" style="max-width:720px;max-height:88vh;overflow-y:auto">
    <div id="readContent"></div>
  </div>
</div><!-- 文章管理面板 -->
<div class="modal-overlay" id="adminModal">
  <div class="modal" style="max-width:640px">
    <div class="modal-title" id="adminModalTitle">✍️ 新建文章</div>
    <div class="modal-sub">自建文章保存在本地，发布后立即在知识库展示</div>
    <div class="field"><label>标题</label><input class="input" id="aTitle" placeholder="文章标题" maxlength="60"></div>
    <div class="grid grid-3" style="gap:12px">
      <div class="field" style="margin:0"><label>分类</label>
        <select class="input" id="aCat">
          <option>训练基础</option><option>营养饮食</option><option>恢复管理</option><option>健康科普</option><option>健身问答</option>
        </select></div>
      <div class="field" style="margin:0"><label>日期</label><input class="input" type="date" id="aDate"></div>
      <div class="field" style="margin:0"><label>阅读(分钟)</label><input class="input" type="number" id="aRead" min="1" max="60" value="5"></div>
    </div>
    <div class="field"><label>摘要</label><input class="input" id="aExcerpt" placeholder="一句话摘要（可选）" maxlength="80"></div>
    <div class="field"><label>正文 <span class="muted">（每行一段，自动渲染为段落）</span></label>
      <textarea class="input" id="aBody" rows="7" placeholder="第一行&#10;第二行&#10;..."></textarea></div>
    <div class="flex-between flex-wrap" style="gap:10px">
      <button class="btn btn-ghost btn-sm" id="changePassBtn">🔑 修改管理密码</button>
      <div class="flex gap-sm">
        <button type="button" class="btn btn-ghost" onclick="window.YDJK_UI.closeModal('adminModal')">取消</button>
        <button class="btn btn-primary" id="adminSave">发布文章</button>
      </div>
    </div>
    <div class="mt-3">
      <div class="card-title" style="font-size:.95rem">📚 我的自建文章</div>
      <div id="adminList"></div>
    </div>
  </div>
</div>

<style>
.tab-bar{display:none}

  .tab-bar{

  }
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--muted);font-size:.68rem;font-weight:700;text-decoration:none;border-radius:12px;transition:color .2s}
  .tab-item .tab-ico{font-size:1.25rem;line-height:1}
  .tab-item.active{color:var(--primary)}
  .tab-plus{
    width:52px;height:52px;border-radius:50%;border:none;margin-top:-22px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:1.6rem;
    box-shadow:0 8px 24px rgba(139,92,246,.45);display:grid;place-items:center;cursor:pointer;

  body{padding-bottom:64px}

  .quick-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
  .qb-ico{font-size:1.8rem}
