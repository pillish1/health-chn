<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>欢迎 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="悦动健康">
<style>
* { margin: 0; padding: 0; box-sizing: border-box; }
body {
  font-family: "PingFang SC", "Microsoft YaHei", -apple-system, sans-serif;
  background: linear-gradient(160deg, #eff6ff 0%, #e0f2fe 60%, #f0fdfa 100%);
  min-height: 100vh; display: flex; flex-direction: column;
  color: #1e293b; -webkit-font-smoothing: antialiased;
}
.wrap { flex: 1; display: flex; flex-direction: column; align-items: center; justify-content: center; padding: 40px 28px; text-align: center; max-width: 420px; margin: 0 auto; width: 100%; }
.logo {
  width: 88px; height: 88px; border-radius: 24px;
  background: linear-gradient(135deg, #3b82f6, #0ea5e9);
  display: grid; place-items: center; font-size: 2.6rem;
  box-shadow: 0 16px 40px rgba(14, 165, 233, .3);
  margin-bottom: 24px;
  animation: logoIn .6s cubic-bezier(.4,0,.2,1) both;
}
@keyframes logoIn { from { opacity: 0; transform: scale(.7) translateY(20px); } to { opacity: 1; transform: none; } }
h1 { font-size: 2rem; font-weight: 900; letter-spacing: -.03em; margin-bottom: 10px; animation: fadeUp .5s .1s both; }
.sub { font-size: 1rem; color: #64748b; line-height: 1.7; margin-bottom: 40px; animation: fadeUp .5s .2s both; }
@keyframes fadeUp { from { opacity: 0; transform: translateY(14px); } to { opacity: 1; transform: none; } }
.features { display: grid; gap: 14px; width: 100%; margin-bottom: 44px; animation: fadeUp .5s .3s both; }
.feat {
  display: flex; align-items: center; gap: 14px; text-align: left;
  background: rgba(255,255,255,.8); border: 1px solid rgba(255,255,255,.9);
  border-radius: 16px; padding: 16px; backdrop-filter: blur(8px);
  box-shadow: 0 4px 16px rgba(0,0,0,.04);
}
.feat .ico { font-size: 1.8rem; width: 48px; height: 48px; border-radius: 14px; display: grid; place-items: center; background: #eff6ff; flex: none; }
/* 图标库（icons.js 注入的 SVG） */
.ic{display:inline-flex;align-items:center;justify-content:center;width:1.25em;height:1.25em;flex:none}
.ic svg{width:100%;height:100%;display:block}
.logo .ic{color:#fff;width:2.2rem;height:2.2rem}
.feat .ico .ic{color:#3b82f6;width:1.7rem;height:1.7rem}
.feat b { font-size: .95rem; display: block; margin-bottom: 2px; }
.feat span { font-size: .8rem; color: #64748b; }
.actions { width: 100%; animation: fadeUp .5s .4s both; }
.btn {
  display: block; width: 100%; padding: 16px; border: none; border-radius: 16px;
  font-size: 1.05rem; font-weight: 800; cursor: pointer;
  transition: all .2s;
}
.btn-primary { background: linear-gradient(135deg, #3b82f6, #0ea5e9); color: #fff; box-shadow: 0 10px 28px rgba(14, 165, 233, .35); }
.btn-primary:hover { transform: translateY(-2px); box-shadow: 0 14px 34px rgba(14, 165, 233, .45); }
.btn-primary:active { transform: scale(.97); }
.btn-ghost { background: transparent; color: #64748b; margin-top: 12px; font-size: .9rem; font-weight: 600; }
.btn-ghost:hover { color: #3b82f6; }
.legal { margin-top: 28px; font-size: .7rem; color: #94a3b8; line-height: 1.6; animation: fadeUp .5s .5s both; }
@media (max-width: 380px) {
  h1 { font-size: 1.7rem; }
  .wrap { padding: 28px 20px; }
}
</style>
</head>
<body>
<div class="wrap">
  <div class="logo"><i class="ic" data-icon="run"></i></div>
  <h1>悦动健康</h1>
  <p class="sub">记录饮食 · 坚持运动 · 看见改变<br>你的私人健康管理助手</p>
  <div class="features">
    <div class="feat"><div class="ico"><i class="ic" data-icon="meal"></i></div><div><b>科学饮食记录</b><span>493 种食物热量库，边吃边算</span></div></div>
    <div class="feat"><div class="ico"><i class="ic" data-icon="workout"></i></div><div><b>运动记录</b><span>120+ 动作库，记录每项训练</span></div></div>
    <div class="feat"><div class="ico"><i class="ic" data-icon="stats"></i></div><div><b>记录一目了然</b><span>饮食摄入与训练记录，随时回看</span></div></div>
  </div>
  <div class="actions">
    <button class="btn btn-primary" onclick="startSetup()">立即开始 →</button>
    <button class="btn btn-ghost" onclick="skipSetup()">先随便看看</button>
  </div>
  <div class="legal">本应用提供的内容仅供参考，不构成医疗建议</div>
</div>
<script>
function startSetup() {
  // 标记需要建档，跳首页触发建档引导
  localStorage.setItem('ydjk:onboard-dismissed', '0');
  location.href = 'index.html?setup=1';
}
function skipSetup() {
  localStorage.setItem('ydjk:onboard-dismissed', '1');
  location.href = 'index.html';
}
</script>
<script src="assets/js/icons.js?v=90"></script>
</body>
</html>
