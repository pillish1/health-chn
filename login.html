<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>登录 · 悦动健康</title>
<meta name="description" content="登录悦动健康，多设备同步你的健康数据。">
<meta name="theme-color" content="#3b82f6">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="icons/favicon-32.png" sizes="32x32">
<link rel="icon" href="icons/icon-192.png" sizes="192x192">
<link rel="apple-touch-icon" href="icons/icon-192.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="悦动健康">
<link rel="stylesheet" href="assets/css/style.css?v=90">
</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search">🔍 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的">👤</button>
  </div>
</div>

<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">
  <div style="text-align:center">
    <img src="icons/icon-192.png" alt="悦动健康" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite">
    <div style="margin-top:12px;color:var(--muted);font-size:.85rem">加载中…</div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }</style>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康 logo"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-links">
      <a href="index.html">首页</a>
      <a href="plans.html">健康追踪</a>
      <a href="plans.html">运动计划</a>
      <a href="foods.html">食物热量</a>
      
    </div>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
      <button class="icon-btn nav-toggle" id="navToggle" title="菜单">☰</button>
    </div>
  </div>
</nav>

<section class="page-hero" style="min-height:52vh;display:flex;align-items:center;padding:40px 0">
  <div class="container">
    <div class="auth-wrap">
      <div class="auth-card">
        <div class="auth-head">
          <span class="auth-logo"><img src="icons/icon-192.png" alt="悦动健康"></span>
          <h1 id="authTitle">欢迎回来</h1>
          <p id="authSub">手机号登录，健康数据云端同步</p>
        </div>
        <!-- 手机号登录（未注册手机号自动创建账号） -->
        <div id="phoneForm">
          <div class="field">
            <label>手机号</label>
            <div class="input-group" style="display:flex;gap:8px">
              <input class="input" type="tel" id="authPhone" placeholder="请输入手机号" autocomplete="tel" maxlength="11" style="flex:1">
              <button class="btn btn-outline btn-sm" id="sendCode" type="button" style="flex:none;white-space:nowrap">获取验证码</button>
            </div>
          </div>
          <div class="field">
            <label>验证码</label>
            <input class="input" type="text" id="authCode" placeholder="6 位验证码" inputmode="numeric" maxlength="6">
          </div>
          <button class="btn btn-primary btn-block btn-lg" id="authSubmit">登 录</button>
          <div class="auth-switch">
            <span class="muted small">未注册手机号将自动创建账号</span>
          </div>
        </div>
        <div id="authMsg" class="small muted text-center mt-2"></div>
      </div>
      <div class="auth-features">
        <h3>登录后你能获得</h3>
        <div class="af-item"><span>☁️</span><div><b>云端同步</b><p>体重、打卡、饮食记录跨设备同步</p></div></div>
        <div class="af-item"><span>🔐</span><div><b>数据私有</b><p>每个用户只能看到自己的数据</p></div></div>
        <div class="af-item"><span>📊</span><div><b>记录沉淀</b><p>饮食与运动记录长期保存，见证改变</p></div></div>
      </div>
    </div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© <span class="js-year">2026</span> 悦动健康 · 让运动成为习惯 | 本站内容仅供参考，不构成医疗建议</div>
  </div>
</footer>

<script src="assets/js/storage.js?v=90"></script>
<script src="assets/js/supabase-config.js?v=90"></script>
<script src="assets/js/app.js?v=90"></script>
<script src="assets/js/pages/login.js?v=90"></script>

<!-- 底部 Tab 导航（移动端 App 式） -->
<nav class="tab-bar">
  <a class="tab-item" data-tab="home" href="index.html"><span class="tab-ico">🏠</span><span class="tab-lbl">首页</span></a>
  <a class="tab-item" data-tab="foods" href="foods.html"><span class="tab-ico">🍽️</span><span class="tab-lbl">饮食</span></a>
  <a class="tab-item" data-tab="plans" href="plans.html"><span class="tab-ico">💪</span><span class="tab-lbl">运动</span></a>
  <a class="tab-item" data-tab="profile" href="profile.html"><span class="tab-ico">👤</span><span class="tab-lbl">我的</span></a>
</nav>


</body>
</html>
