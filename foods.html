    </div>
  </div>

<header class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">首页</a><span>›</span><span>饮食记录</span></div>
    <h1><i class="ic" data-icon="meal"></i> 饮食记录</h1>
    <p>记录每天的饮食，按早餐、午餐、晚餐、加餐管理，随时回看每一天的摄入。</p>
  </div>
</header>

<section class="section-sm">
  <div class="container">
    <!-- 日期导航（查看/补记任意一天的饮食） -->
    <div class="card mb-3" style="padding:10px 12px">
      <div style="display:flex;align-items:center;gap:6px">
        <button class="btn btn-ghost btn-sm" id="datePrev" type="button" style="flex:none;padding:6px 12px" aria-label="前一天">‹</button>
        <button type="button" id="dateLabel" class="btn-link" style="flex:1;text-align:center;font-weight:800;font-size:1rem;display:flex;flex-direction:column;align-items:center;gap:2px;padding:4px;border:none;background:none">
          <span id="dateTextCN">今天</span>
          <span id="dateText" class="small muted" style="font-weight:600">--</span>
        </button>
        <button class="btn btn-ghost btn-sm" id="dateNext" type="button" style="flex:none;padding:6px 12px" aria-label="后一天">›</button>
        <button class="btn btn-outline btn-xs" id="dateToday" type="button" style="flex:none;margin-left:4px">今天</button>
      </div>
      <input type="date" id="dateInput" style="position:absolute;opacity:0;width:1px;height:1px;pointer-events:none" tabindex="-1" aria-hidden="true">
    </div>

    <!-- 当日摄入摘要 -->
    <div class="card mb-3">
      <div class="flex-between" style="margin-bottom:14px">
        <div class="card-title" style="margin:0"><i class="ic" data-icon="stats"></i> <span id="intakeTitle">今日摄入</span></div>
        <div style="text-align:right">
          <div style="font-size:1.35rem;font-weight:900;line-height:1"><b id="intakeKcalNum">0</b> <span class="muted" style="font-size:.78rem;font-weight:600">/ 目标 <b id="intakeGoalNum" style="color:var(--text)">2000</b> kcal</span></div>
          <div class="small muted" id="intakeRemain"></div>
        </div>
      </div>
      <div id="foodSummary" class="grid grid-2" style="align-items:center">
        <div id="calRing" style="display:flex;justify-content:center"></div>
        <div id="macroBar"></div>
      </div>
      <div class="intake-tip" id="intakeTip"></div>
    </div>

    <!-- 今日饮食记录（今天吃了什么） -->
    <div class="card mb-3">
      <div class="flex-between" style="margin-bottom:12px">
        <div class="card-title" style="margin:0"><i class="ic" data-icon="food"></i> 今日饮食</div>
        <div class="flex gap-sm" style="gap:8px">
          <button class="btn btn-outline btn-sm" id="btnCopyYesterday" type="button" style="display:none"><i class="ic" data-icon="refresh"></i> 复制昨天</button>
          <button class="btn btn-outline btn-sm" id="btnManualMeal" type="button"><i class="ic" data-icon="edit"></i> 手动</button>
          <button class="btn btn-primary btn-sm" id="btnPickFood" type="button" onclick="if(window.YDJK_UI){window.YDJK_UI.openModal('foodPickerModal');if(window._renderMealTpls)window._renderMealTpls();setTimeout(function(){var i=document.getElementById('foodSearch');if(i)i.focus();},100)}">＋ 记一餐</button>
        </div>
      </div>
      <div id="mealList"></div>
      <div id="mealEmpty" class="empty hidden"><div class="e-icon"><i class="ic" data-icon="food"></i></div><div class="e-title" id="mealEmptyTitle">今天还没有饮食记录</div><div class="e-desc" id="mealEmptyDesc">点「记一餐」，搜索食物记下今天吃的</div></div>
      <div class="alert success mt-2" id="mealTotal" style="display:none"></div>
    </div>

    <!-- 手动添加饮食弹窗 -->
    <div class="modal-overlay" id="manualMealModal">
      <div class="modal" style="max-width:480px">
        <div class="modal-title"><i class="ic" data-icon="edit"></i> 手动添加饮食</div>
        <div class="modal-sub">记录一份没有在食物库中的食物</div>
        <div class="field"><label>餐次</label><select class="input" id="manualType"></select></div>
        <div class="field"><label>食物名称</label><input class="input" id="manualName" placeholder="如：一碗面条"></div>
        <div class="field"><label>热量 (kcal)</label><input class="input" type="number" id="manualKcal" min="0" placeholder="0"></div>
        <div class="field"><label>蛋白 / 碳水 / 脂肪 (g)</label>
          <div class="flex gap-sm">
            <input class="input" type="number" id="manualP" placeholder="蛋白" style="padding:10px 8px">
            <input class="input" type="number" id="manualC" placeholder="碳水" style="padding:10px 8px">
            <input class="input" type="number" id="manualF" placeholder="脂肪" style="padding:10px 8px">
          </div>
        </div>
        <div class="flex gap-sm mt-2">
          <button class="btn btn-ghost" style="flex:1" onclick="window.YDJK_UI.closeModal('manualMealModal')">取消</button>
          <button class="btn btn-primary" id="manualAdd" style="flex:1">保存记录</button>
        </div>
      </div>
    </div>

  </div>
</section>

<!-- 记餐弹窗（搜索 + 分类 + 食物列表） -->
<div class="modal-overlay sheet" id="foodPickerModal">
  <div class="modal" style="max-width:520px">
    <div class="modal-title"><i class="ic" data-icon="food"></i> 记一餐</div>
    <div class="search-box" style="margin:0 0 12px">
      <span class="s-ico"><i class="ic" data-icon="search"></i></span>
      <input class="input" id="foodSearch" placeholder="搜索食物，如：鸡胸肉、米饭、苹果…" autocomplete="off">
    </div>
    <div class="flex gap-sm flex-wrap" style="margin-bottom:10px">
      <div class="tabs" id="catTabs" style="margin:0;flex:1"></div>
    </div>
    <div id="mealTpls" class="meal-tpls" style="margin-bottom:10px"></div>
    <div class="flex gap-sm flex-wrap" style="margin-bottom:12px">
      <div id="recentFoods" class="recent-foods"></div>
    </div>
    <div class="food-toolbar">
      <div class="kcal-pills" id="kcalPills">
        <button type="button" class="kcal-pill active" data-kcal="all">全部</button>
        <button type="button" class="kcal-pill" data-kcal="low">低卡</button>
        <button type="button" class="kcal-pill" data-kcal="mid">中卡</button>
        <button type="button" class="kcal-pill" data-kcal="high">高卡</button>
      </div>
      <div class="sort-wrap">
        <button type="button" class="sort-btn" id="sortBtn"><i class="ic" data-icon="sort"></i>排序<span class="sort-arrow">▾</span></button>
        <div class="sort-menu" id="sortMenu">
          <button type="button" class="sort-opt active" data-sort="default">默认排序</button>
          <button type="button" class="sort-opt" data-sort="kcal-asc">热量从低到高</button>
          <button type="button" class="sort-opt" data-sort="kcal-desc">热量从高到低</button>
          <button type="button" class="sort-opt" data-sort="protein-desc">蛋白质从高到低</button>
        </div>
      </div>
    </div>
    <div class="grid grid-2" id="foodGrid" style="max-height:40vh;overflow-y:auto"></div>
  </div>
</div>

<!-- 记餐弹窗 -->
<div class="modal-overlay sheet" id="mealModal">
  <div class="modal">
    <div class="modal-title" id="mealModalTitle">记一餐</div>
    <div class="modal-sub" id="mealModalSub"></div>
    <div class="field">
      <label>餐次</label>
      <div class="radio-group" id="mealTypeGroup"></div>
    </div>
    <div class="field">
      <label>份量（克）</label>
      <div class="range-wrap">
        <input type="range" id="mealGram" min="10" max="500" value="100" step="10">
        <span class="range-val" id="mealGramVal">100 g</span>
      </div>
      <div class="flex gap-sm mt-1 flex-wrap" id="quickGramBtns"></div>
    <button class="btn btn-ghost btn-sm mt-2" id="btnSaveTpl" type="button" style="width:100%"><i class="ic" data-icon="save"></i> 把这道食物存为套餐</button>
    </div>
    <div class="alert success" id="mealCalc"></div>
    <div class="flex gap-sm" style="gap:10px">
      <button type="button" class="btn btn-ghost" onclick="window.YDJK_UI.closeModal('mealModal')" style="flex:1">取消</button>
      <button class="btn btn-primary" id="mealSave" style="flex:1"><i class="ic" data-icon="check"></i> 加入今日记录</button>
    </div>
  </div>
</div>
