<header class="page-hero">
  <div class="container">
    <div class="breadcrumb"><a href="index.html">首页</a><span>›</span><span>食物热量</span></div>
    <h1>🥗 食物热量库</h1>
    <p>查询常见食物的热量与营养，点击「记一餐」即可把食物计入今日摄入（数据仅存本地）。</p>
  </div>
</header>

<section class="section-sm">
  <div class="container">
    <!-- 今日摄入摘要 -->
    <div class="card mb-3">
      <div class="card-title">📊 今日摄入</div>
      <div id="foodSummary" class="grid grid-2" style="align-items:center">
        <div id="calRing" style="display:flex;justify-content:center"></div>
        <div id="macroBar"></div>
      </div>
    </div>

    <div class="search-box">
      <span class="s-ico">🔍</span>
      <input class="input" id="foodSearch" placeholder="搜索食物，如：鸡胸肉、米饭、苹果…">
    </div>
    <div class="flex-between flex-wrap" style="margin-bottom:20px">
      <div class="tabs" id="catTabs" style="margin:0"></div>
      <div class="flex gap-sm" style="gap:10px;flex-wrap:wrap">
        <select class="input" id="kcalRange" style="width:auto;padding:8px 34px 8px 14px;border-radius:var(--radius-full)">
          <option value="all">全部热量</option>
          <option value="low">低卡 (&lt;100)</option>
          <option value="mid">中卡 (100-300)</option>
          <option value="high">高卡 (&gt;300)</option>
        </select>
        <select class="input" id="sortSel" style="width:auto;padding:8px 34px 8px 14px;border-radius:var(--radius-full)">
          <option value="default">默认排序</option>
          <option value="kcal-asc">热量从低到高</option>
          <option value="kcal-desc">热量从高到低</option>
          <option value="protein-desc">蛋白质从高到低</option>
        </select>
      </div>
    </div>
    <div class="grid grid-3" id="foodGrid"></div>
  </div>
</section>

<!-- 记餐弹窗 -->
<div class="modal-overlay" id="mealModal">
  <div class="modal">
    <div class="modal-title" id="mealModalTitle">记一餐</div>
    <div class="modal-sub" id="mealModalSub"></div>
    <div class="field">
      <label>餐次</label>
      <div class="radio-group" id="mealTypeGroup"></div>
    </div>
    <div class="field">
      <label>份量（克）</label>
      <div class="range-wrap">
        <input type="range" id="mealGram" min="10" max="500" value="100" step="10">
        <span class="range-val" id="mealGramVal">100 g</span>
      </div>
      <div class="flex gap-sm mt-1 flex-wrap" id="quickGramBtns"></div>
    </div>
    <div class="alert success" id="mealCalc"></div>
    <div class="flex gap-sm" style="gap:10px">
      <button type="button" class="btn btn-ghost" onclick="window.YDJK_UI.closeModal('mealModal')" style="flex:1">取消</button>
      <button class="btn btn-primary" id="mealSave" style="flex:1">✅ 加入今日记录</button>
    </div>
  </div>
</div>
