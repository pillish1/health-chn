<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发布文章 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="assets/css/style.css?v=49">
</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search" onclick="location.href='discover.html'">🔍 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的">👤</button>
  </div>
</div>

<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">
  <div style="text-align:center">
    <img src="icons/icon-192.png" alt="悦动健康" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite">
    <div style="margin-top:12px;color:var(--muted);font-size:.85rem">加载中…</div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }</style>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康 logo"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="切换主题">🌙</button>
      <button class="icon-btn" id="backBtn" title="返回" onclick="history.back()">←</button>
    </div>
  </div>
</nav>

<section class="page-hero">
  <div class="container">
    <h1>📝 发布健康文章</h1>
    <p>文章发布后将立即出现在健康知识页（需管理员权限）</p>
  </div>
</section>

<section class="section-sm">
  <div class="container" style="max-width:760px">
    <div id="adminCheck" class="alert warn">正在验证管理员权限…</div>
    <div id="pubForm" style="display:none">
      <div class="field"><label>标题</label><input class="input" id="aTitle" maxlength="60" placeholder="文章标题"></div>
      <div class="grid grid-3" style="gap:12px">
        <div class="field" style="margin:0"><label>分类</label>
          <select class="input" id="aCat"><option>训练基础</option><option>营养饮食</option><option>恢复管理</option><option>健康科普</option><option>健身问答</option></select></div>
        <div class="field" style="margin:0"><label>日期</label><input class="input" type="date" id="aDate"></div>
        <div class="field" style="margin:0"><label>阅读(分钟)</label><input class="input" type="number" id="aRead" min="1" max="60" value="5"></div>
      </div>
      <div class="field"><label>摘要</label><input class="input" id="aExcerpt" maxlength="80" placeholder="一句话摘要"></div>
      <div class="field"><label>正文 <span class="muted">（支持 HTML 标签，如 &lt;p&gt;段落&lt;/p&gt;）</span></label>
        <textarea class="input" id="aBody" rows="10" placeholder="<p>第一段内容</p>&#10;<p>第二段内容</p>"></textarea></div>
      <div class="flex gap-sm">
        <button class="btn btn-ghost" onclick="history.back()">取消</button>
        <button class="btn btn-primary" id="pubSave" style="flex:1">🚀 发布文章</button>
      </div>
    </div>
  </div>
</section>

<script src="assets/js/storage.js?v=49"></script>
<script src="assets/js/supabase-config.js?v=49"></script>
<script src="assets/js/app.js?v=49"></script>
<script>
(function () {
  'use strict';
  document.addEventListener('DOMContentLoaded', function () {
    var checkEl = document.getElementById('adminCheck');
    var form = document.getElementById('pubForm');
    var cloud = window.YD_CLOUD;
    if (!cloud || !cloud.isLoggedIn()) {
      checkEl.className = 'alert warn';
      checkEl.innerHTML = '请先登录后发布文章。<a href="login.html" style="font-weight:700">去登录 →</a>';
      return;
    }
    cloud.isAdmin().then(function (isAdmin) {
      if (isAdmin) {
        checkEl.className = 'alert success';
        checkEl.innerHTML = '✅ 管理员已验证，可以发布文章';
        form.style.display = 'block';
        document.getElementById('aDate').value = window.YDJK ? window.YDJK.today() : new Date().toISOString().slice(0, 10);
      } else {
        checkEl.className = 'alert danger';
        checkEl.innerHTML = '❌ 你没有发布权限（仅管理员可发布）';
      }
    }).catch(function () {
      checkEl.className = 'alert danger';
      checkEl.innerHTML = '权限验证失败，请重试';
    });
    document.getElementById('pubSave').addEventListener('click', async function () {
      var title = document.getElementById('aTitle').value.trim();
      var body = document.getElementById('aBody').value.trim();
      if (!title || !body) { window.YDJK_UI.toast('请填写标题和正文', 'err'); return; }
      var btn = this;
      btn.disabled = true;
      btn.textContent = '发布中…';
      var article = {
        title: title,
        cat: document.getElementById('aCat').value,
        date: document.getElementById('aDate').value,
        read_time: Number(document.getElementById('aRead').value) || 5,
        excerpt: document.getElementById('aExcerpt').value.trim() || title,
        body: body,
        published: true
      };
      var r = await cloud.saveArticle(article);
      if (r.ok) {
        window.YDJK_UI.toast('✅ 文章已发布');
        setTimeout(function () { location.href = 'articles.html'; }, 900);
      } else {
        btn.disabled = false;
        btn.textContent = '🚀 发布文章';
        window.YDJK_UI.toast('❌ 发布失败：' + ((r.data && r.data.message) || '权限不足'), 'err');
      }
    });
  });
})();
</script>

<!-- 底部 Tab 导航（移动端 App 式） -->
<nav class="tab-bar">
  <a class="tab-item" data-tab="home" href="index.html"><span class="tab-ico">🏠</span><span class="tab-lbl">首页</span></a>
  <a class="tab-item" data-tab="discover" href="discover.html"><span class="tab-ico">🧭</span><span class="tab-lbl">发现</span></a>
  <button class="tab-plus" id="tabPlusBtn" aria-label="快速记录"><span>＋</span></button>
  <a class="tab-item" data-tab="tracker" href="tracker.html"><span class="tab-ico">📊</span><span class="tab-lbl">记录</span></a>
  <a class="tab-item" data-tab="profile" href="profile.html"><span class="tab-ico">👤</span><span class="tab-lbl">我的</span></a>
</nav>

<!-- 快速记录面板 -->
<div class="modal-overlay" id="quickModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-title">⚡ 快速记录</div>
    <div class="modal-sub">随手记，养成习惯更简单</div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="location.href='foods.html'"><span class="qb-ico">🍽️</span><b>记一餐</b><small>查询食物热量</small></button>
      <button class="quick-btn" onclick="location.href='tracker.html#workout'"><span class="qb-ico">🏃</span><b>运动打卡</b><small>记录今日运动</small></button>
      <button class="quick-btn" onclick="location.href='tracker.html#weight'"><span class="qb-ico">⚖️</span><b>记录体重</b><small>追踪体重变化</small></button>
      <button class="quick-btn" onclick="location.href='tracker.html'"><span class="qb-ico">💧</span><b>饮水打卡</b><small>补充水分</small></button>
    </div>
  </div>
</div>

<style>
.tab-bar{display:none}
@media(max-width:900px){
  .tab-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:150;
    display:flex;align-items:center;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(14px);
  }
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--muted);font-size:.68rem;font-weight:700;text-decoration:none;border-radius:12px;transition:color .2s}
  .tab-item .tab-ico{font-size:1.25rem;line-height:1}
  .tab-item.active{color:var(--primary)}
  .tab-plus{
    width:52px;height:52px;border-radius:50%;border:none;margin-top:-22px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:1.6rem;
    box-shadow:0 8px 24px rgba(139,92,246,.45);display:grid;place-items:center;cursor:pointer;
    transition:transform .2s;
  }
  .tab-plus:active{transform:scale(.92)}
  body{padding-bottom:64px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .quick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface-2);cursor:pointer;transition:all .2s}
  .quick-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
  .qb-ico{font-size:1.8rem}
  .quick-btn b{font-size:.9rem}
  .quick-btn small{font-size:.7rem;color:var(--muted)}
}
</style>
</body>
</html>
