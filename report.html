<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>健康报告 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="assets/css/style.css?v=50">
</head>
<body>
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-actions"><button class="icon-btn" onclick="history.back()">←</button></div>
</div>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-actions"><button class="icon-btn" id="themeToggle">🌙</button><button class="icon-btn" onclick="history.back()">←</button></div>
  </div>
</nav>
<header class="page-hero">
  <div class="container">
    <h1>📈 健康报告</h1>
    <p>你的健康数据，一目了然</p>
  </div>
</header>
<section class="section-sm">
  <div class="container">
    <div class="report-tabs" id="reportTabs">
      <button class="report-tab active" data-range="week">📊 本周</button>
      <button class="report-tab" data-range="month">📅 本月</button>
    </div>
    <div id="reportContent"></div>
    <div class="flex gap-sm mt-3" style="justify-content:center;flex-wrap:wrap">
      <button class="btn btn-primary btn-sm" id="btnShareImage">🖼️ 生成分享图</button>
      <button class="btn btn-outline btn-sm" id="btnExportReport">📤 复制周报</button>
      <button class="btn btn-ghost btn-sm" id="btnExportJson">💾 导出数据</button>
    </div>
    <div id="shareCardWrap" style="display:none;margin-top:20px;text-align:center">
      <canvas id="shareCanvas" style="max-width:100%;border-radius:20px;box-shadow:var(--shadow-lg)"></canvas>
      <div class="flex gap-sm mt-2" style="justify-content:center">
        <button class="btn btn-primary btn-sm" id="btnSaveImage">💾 保存图片</button>
        <button class="btn btn-ghost btn-sm" onclick="document.getElementById('shareCardWrap').style.display='none'">关闭</button>
      </div>
    </div>
  </div>
</section>
<script src="assets/js/storage.js?v=50"></script>
<script src="assets/js/data.js?v=50"></script>
<script src="assets/js/charts.js?v=50"></script>
<script src="assets/js/supabase-config.js?v=50"></script>
<script src="assets/js/app.js?v=50"></script>
<script src="assets/js/pages/report.js?v=50"></script>
</body>
</html>
