<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人资料 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/style.css?v=90">
</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search"><i class="ic" data-icon="search"></i> 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的"><i class="ic" data-icon="user"></i></button>
  </div>
</div>

<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">
  <div style="text-align:center">
    <img src="icons/icon-192.png" alt="悦动健康" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite">
    <div style="margin-top:12px;color:var(--muted);font-size:.85rem">加载中…</div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }</style>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="主题"><i class="ic" data-icon="moon"></i></button>
      <button class="icon-btn" onclick="history.back()" title="返回">←</button>
    </div>
  </div>
</nav>

<section class="page-hero">
  <div class="container">
    <h1><i class="ic" data-icon="user"></i> 个人资料</h1>
    <p>个人形象与数据备份</p>
  </div>
</section>

<section class="section-sm">
  <div class="container" style="max-width:640px">
    <div id="profilePanel">
      <!-- 头像昵称 -->
      <div class="card mb-3">
        <div class="card-title"><i class="ic" data-icon="photo"></i> 个人形象</div>
        <div class="flex gap-md" style="align-items:center;margin-bottom:16px">
          <div id="avatarPreview" style="width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--primary);display:grid;place-items:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-weight:800;flex:none"></div>
          <div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none">
            <button class="btn btn-outline btn-sm" id="btnUploadAvatar"><i class="ic" data-icon="camera"></i> 上传头像</button>
            <div class="small muted mt-1">支持 JPG/PNG，最大 2MB</div>
          </div>
        </div>
        <div class="field"><label>昵称</label><input class="input" id="nicknameInput" maxlength="20" placeholder="给自己起个昵称"></div>
        <button class="btn btn-primary btn-block" id="btnSaveProfile"><i class="ic" data-icon="save"></i> 保存资料</button>
      </div>

      <!-- 数据备份（本地模式） -->
      <div class="card mb-3">
        <div class="card-title"><i class="ic" data-icon="folder"></i> 数据备份</div>
        <p class="text-2 small">数据仅保存在这台设备上。导出 JSON 文件可随时备份，换手机时在新设备导入即可恢复全部记录。</p>
        <div class="flex gap-sm" style="flex-wrap:wrap">
          <button class="btn btn-outline btn-sm" id="btnExportData"><i class="ic" data-icon="upload"></i> 导出备份</button>
          <button class="btn btn-outline btn-sm" id="btnImportData"><i class="ic" data-icon="save"></i> 导入备份</button>
        </div>
        <input type="file" id="importInput" accept=".json,application/json" style="display:none">
        <div class="small muted mt-2" id="backupStatus"></div>
      </div>
    </div>
  </div>
</section>

<script src="assets/js/storage.js?v=90"></script>

<script src="assets/js/app.js?v=90"></script>
<script src="assets/js/pages/profile.js?v=90"></script>

<!-- 底部 Tab 导航（移动端 App 式） -->
<nav class="tab-bar">
  <a class="tab-item" data-tab="home" href="index.html"><span class="tab-ico"><i class="ic" data-icon="home"></i></span><span class="tab-lbl">首页</span></a>
  <a class="tab-item" data-tab="foods" href="foods.html"><span class="tab-ico"><i class="ic" data-icon="food"></i></span><span class="tab-lbl">饮食</span></a>
  <a class="tab-item" data-tab="plans" href="plans.html"><span class="tab-ico"><i class="ic" data-icon="workout"></i></span><span class="tab-lbl">运动</span></a>
  <a class="tab-item" data-tab="profile" href="profile.html"><span class="tab-ico"><i class="ic" data-icon="user"></i></span><span class="tab-lbl">我的</span></a>
</nav>


<script src="assets/js/icons.js?v=90"></script>
</body>
</html>
