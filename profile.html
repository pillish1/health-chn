<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>个人资料 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<meta name="robots" content="noindex">
<link rel="stylesheet" href="assets/css/style.css?v=90">
</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search">🔍 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的">👤</button>
  </div>
</div>

<div id="pageLoader" style="position:fixed;inset:0;background:var(--bg);z-index:1000;display:flex;align-items:center;justify-content:center;transition:opacity .3s">
  <div style="text-align:center">
    <img src="icons/icon-192.png" alt="悦动健康" style="width:56px;height:56px;border-radius:16px;box-shadow:0 8px 24px rgba(139,92,246,.3);animation:pulse 1.2s ease-in-out infinite">
    <div style="margin-top:12px;color:var(--muted);font-size:.85rem">加载中…</div>
  </div>
</div>
<style>@keyframes pulse { 0%,100%{transform:scale(1)} 50%{transform:scale(1.08)} }</style>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="主题">🌙</button>
      <button class="icon-btn" onclick="history.back()" title="返回">←</button>
    </div>
  </div>
</nav>

<section class="page-hero">
  <div class="container">
    <h1>👤 个人资料</h1>
    <p>管理你的账号信息</p>
  </div>
</section>

<section class="section-sm">
  <div class="container" style="max-width:640px">
    <div id="profileGate" class="card text-center">
      <p class="muted">请先登录</p>
      <button class="btn btn-primary" onclick="location.href='login.html'">去登录 →</button>
    </div>

    <div id="profilePanel" style="display:none">
      <!-- 头像昵称 -->
      <div class="card mb-3">
        <div class="card-title">🖼️ 个人形象</div>
        <div class="flex gap-md" style="align-items:center;margin-bottom:16px">
          <div id="avatarPreview" style="width:72px;height:72px;border-radius:50%;overflow:hidden;border:3px solid var(--primary);display:grid;place-items:center;font-size:1.8rem;background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-weight:800;flex:none"></div>
          <div>
            <input type="file" id="avatarInput" accept="image/*" style="display:none">
            <button class="btn btn-outline btn-sm" id="btnUploadAvatar">📷 上传头像</button>
            <div class="small muted mt-1">支持 JPG/PNG，最大 2MB</div>
          </div>
        </div>
        <div class="field"><label>昵称</label><input class="input" id="nicknameInput" maxlength="20" placeholder="给自己起个昵称"></div>
        <button class="btn btn-primary btn-block" id="btnSaveProfile">💾 保存资料</button>
      </div>

      <!-- 账号信息 -->
      <div class="card mb-3">
        <div class="card-title">📧 账号信息</div>
        <div class="list-row"><div class="lr-main"><b class="small">邮箱</b></div><div class="lr-side" id="pEmail"></div></div>
        <div class="list-row"><div class="lr-main"><b class="small">注册时间</b></div><div class="lr-side" id="pCreated"></div></div>
        <div class="list-row"><div class="lr-main"><b class="small">最近登录</b></div><div class="lr-side" id="pLastSignIn"></div></div>
      </div>

      <!-- 数据管理 -->
      <div class="card mb-3">
        <div class="card-title">☁️ 云数据</div>
        <p class="text-2 small">你的记录（体重/打卡/饮食/计划）保存在云端，登录任意设备即可查看。</p>
        <div class="flex gap-sm">
          <button class="btn btn-outline btn-sm" id="btnSyncNow">🔄 立即同步</button>
          <button class="btn btn-ghost btn-sm" id="btnExportData">📤 导出数据</button>
        </div>
        <div class="small muted mt-2" id="syncStatus"></div>
        <div class="small muted mt-1">💡 导出为 JSON 文件，可离线保存或迁移到其他设备</div>
      </div>

      <!-- 退出 -->
      <button class="btn btn-danger btn-block" id="btnLogout">🚪 退出登录</button>
    </div>
  </div>
</section>

<script src="assets/js/storage.js?v=90"></script>
<script src="assets/js/supabase-config.js?v=90"></script>
<script src="assets/js/app.js?v=90"></script>
<script src="assets/js/pages/profile.js?v=90"></script>

<!-- 底部 Tab 导航（移动端 App 式） -->
<nav class="tab-bar">
  <a class="tab-item" data-tab="home" href="index.html"><span class="tab-ico">🏠</span><span class="tab-lbl">首页</span></a>
  <a class="tab-item" data-tab="plans" href="plans.html"><span class="tab-ico">💪</span><span class="tab-lbl">运动</span></a>
  <a class="tab-item" data-tab="foods" href="foods.html"><span class="tab-ico">🍽️</span><span class="tab-lbl">饮食</span></a>
  <a class="tab-item" data-tab="profile" href="profile.html"><span class="tab-ico">👤</span><span class="tab-lbl">我的</span></a>
</nav>

<style>
.tab-bar{display:none}
@media(max-width:900px){
  .tab-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:150;
    display:flex;align-items:center;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(14px);
  }
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--muted);font-size:.68rem;font-weight:700;text-decoration:none;border-radius:12px;transition:color .2s}
  .tab-item .tab-ico{font-size:1.25rem;line-height:1}
  .tab-item.active{color:var(--primary)}
  .tab-plus{
    width:52px;height:52px;border-radius:50%;border:none;margin-top:-22px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:1.6rem;
    box-shadow:0 8px 24px rgba(139,92,246,.45);display:grid;place-items:center;cursor:pointer;
    transition:transform .2s;
  }
  .tab-plus:active{transform:scale(.92)}
  body{padding-bottom:64px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .quick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface-2);cursor:pointer;transition:all .2s}
  .quick-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
  .qb-ico{font-size:1.8rem}
  .quick-btn b{font-size:.9rem}
  .quick-btn small{font-size:.7rem;color:var(--muted)}
}
</style>
</body>
</html>
