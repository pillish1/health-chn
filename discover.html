<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>发现 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="assets/css/style.css?v=53">
</head>
<body>

<!-- 移动端 App 头 -->
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-search" onclick="location.href='discover.html'">🔍 搜索健康知识、计划…</div>
  <div class="m-actions">
    <button class="icon-btn" id="mProfileBtn" onclick="location.href='profile.html'" aria-label="我的">👤</button>
  </div>
</div>

<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-actions">
      <button class="icon-btn" id="themeToggle" title="主题">🌙</button>
      <button class="icon-btn" onclick="location.href='index.html'" title="首页">🏠</button>
    </div>
  </div>
</nav>

<header class="page-hero">
  <div class="container">
    <h1>🧭 发现</h1>
    <p>热门计划 · 精选文章 · 实用工具，发现健康生活</p>
  </div>
</header>

<section class="section-sm">
  <div class="container">
    <!-- 工具快捷入口 -->
    <h2 class="section-title" style="font-size:1.2rem">🛠️ 实用工具</h2>
    <div class="grid grid-4" style="margin-top:18px">
      <a href="bmi.html" class="card card-hover text-center" style="padding:20px"><div style="font-size:2rem">📊</div><b class="small" style="margin-top:6px;display:block">BMI 计算</b></a>
      <a href="calorie.html" class="card card-hover text-center" style="padding:20px"><div style="font-size:2rem">🔥</div><b class="small" style="margin-top:6px;display:block">卡路里</b></a>
      <a href="foods.html" class="card card-hover text-center" style="padding:20px"><div style="font-size:2rem">🥗</div><b class="small" style="margin-top:6px;display:block">食物库</b></a>
      <a href="plans.html" class="card card-hover text-center" style="padding:20px"><div style="font-size:2rem">💪</div><b class="small" style="margin-top:6px;display:block">计划</b></a>
    </div>

    <!-- 热门计划 -->
    <h2 class="section-title" style="font-size:1.2rem;margin-top:36px">🔥 热门计划</h2>
    <div class="grid grid-3" id="hotPlans" style="margin-top:18px"></div>

    <!-- 精选文章 -->
    <h2 class="section-title" style="font-size:1.2rem;margin-top:36px">📖 精选文章</h2>
    <div class="grid grid-3" id="hotArticles" style="margin-top:18px"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">
    <div class="footer-bottom">© <span class="js-year">2026</span> 悦动健康 · 让运动成为习惯</div>
  </div>
</footer>

<script src="assets/js/storage.js?v=53"></script>
<script src="assets/js/data.js?v=53"></script>
<script src="assets/js/supabase-config.js?v=53"></script>
<script src="assets/js/app.js?v=53"></script>
<script>
(function () {
  'use strict';
  function esc(s) { return String(s || '').replace(/[&<>"']/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
  document.addEventListener('DOMContentLoaded', function () {
    // 热门计划
    var plans = window.YDJK_DATA.PLANS;
    document.getElementById('hotPlans').innerHTML = plans.map(function (p) {
      return '<a href="plans.html" class="card card-hover"><div class="flex-between"><div class="card-title" style="margin:0">' + p.emoji + ' ' + esc(p.name) + '</div><span class="tag ' + p.color + '">' + p.weekly + '</span></div>' +
        '<div class="card-sub mt-1">' + esc(p.desc) + '</div></a>';
    }).join('');
    // 精选文章（云端）
    var artEl = document.getElementById('hotArticles');
    if (window.YD_CLOUD) {
      window.YD_CLOUD.loadArticles().then(function (arts) {
        if (arts && arts.length) {
          artEl.innerHTML = arts.slice(0, 3).map(function (a) {
            return '<a href="articles.html" class="card card-hover article-card"><div class="a-meta"><span class="tag blue">' + esc(a.cat) + '</span><span>⏱ ' + (a.read_time || 5) + ' 分钟</span></div>' +
              '<div class="a-title">' + esc(a.title) + '</div><div class="a-excerpt">' + esc(a.excerpt) + '</div></a>';
          }).join('');
        }
      }).catch(function () {});
    }
  });
})();
</script>
<!-- 底部 Tab 导航（移动端 App 式） -->
<nav class="tab-bar">
  <a class="tab-item" data-tab="home" href="index.html"><span class="tab-ico">🏠</span><span class="tab-lbl">首页</span></a>
  <a class="tab-item" data-tab="discover" href="discover.html"><span class="tab-ico">🧭</span><span class="tab-lbl">发现</span></a>
  <button class="tab-plus" id="tabPlusBtn" aria-label="快速记录"><span>＋</span></button>
  <a class="tab-item" data-tab="tracker" href="tracker.html"><span class="tab-ico">📊</span><span class="tab-lbl">记录</span></a>
  <a class="tab-item" data-tab="profile" href="profile.html"><span class="tab-ico">👤</span><span class="tab-lbl">我的</span></a>
</nav>

<!-- 快速记录面板 -->
<div class="modal-overlay" id="quickModal">
  <div class="modal" style="max-width:480px">
    <div class="modal-title">⚡ 快速记录</div>
    <div class="modal-sub">随手记，养成习惯更简单</div>
    <div class="quick-grid">
      <button class="quick-btn" onclick="location.href='foods.html'"><span class="qb-ico">🍽️</span><b>记一餐</b><small>查询食物热量</small></button>
      <button class="quick-btn" onclick="location.href='tracker.html#workout'"><span class="qb-ico">🏃</span><b>运动打卡</b><small>记录今日运动</small></button>
      <button class="quick-btn" onclick="location.href='tracker.html#weight'"><span class="qb-ico">⚖️</span><b>记录体重</b><small>追踪体重变化</small></button>
      <button class="quick-btn" onclick="location.href='tracker.html'"><span class="qb-ico">💧</span><b>饮水打卡</b><small>补充水分</small></button>
    </div>
  </div>
</div>

<style>
.tab-bar{display:none}
@media(max-width:900px){
  .tab-bar{
    position:fixed;bottom:0;left:0;right:0;z-index:150;
    display:flex;align-items:center;justify-content:space-around;
    background:var(--surface);border-top:1px solid var(--border);
    padding:6px 4px calc(6px + env(safe-area-inset-bottom));
    backdrop-filter:blur(14px);
  }
  .tab-item{display:flex;flex-direction:column;align-items:center;gap:2px;padding:6px 14px;color:var(--muted);font-size:.68rem;font-weight:700;text-decoration:none;border-radius:12px;transition:color .2s}
  .tab-item .tab-ico{font-size:1.25rem;line-height:1}
  .tab-item.active{color:var(--primary)}
  .tab-plus{
    width:52px;height:52px;border-radius:50%;border:none;margin-top:-22px;
    background:linear-gradient(135deg,#3b82f6,#8b5cf6);color:#fff;font-size:1.6rem;
    box-shadow:0 8px 24px rgba(139,92,246,.45);display:grid;place-items:center;cursor:pointer;
    transition:transform .2s;
  }
  .tab-plus:active{transform:scale(.92)}
  body{padding-bottom:64px}
  .quick-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-top:16px}
  .quick-btn{display:flex;flex-direction:column;align-items:center;gap:4px;padding:18px 12px;border:1px solid var(--border);border-radius:16px;background:var(--surface-2);cursor:pointer;transition:all .2s}
  .quick-btn:hover{border-color:var(--primary);transform:translateY(-2px)}
  .qb-ico{font-size:1.8rem}
  .quick-btn b{font-size:.9rem}
  .quick-btn small{font-size:.7rem;color:var(--muted)}
}
</style>
</body>
</html>
