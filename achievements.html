<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>成就 · 悦动健康</title>
<meta name="theme-color" content="#3b82f6">
<link rel="stylesheet" href="assets/css/style.css?v=49">
</head>
<body>
<div class="m-header">
  <a class="m-logo" href="index.html"><img src="icons/icon-192.png" alt="悦动健康">悦动健康</a>
  <div class="m-actions"><button class="icon-btn" onclick="history.back()">←</button></div>
</div>
<nav class="navbar">
  <div class="nav-inner">
    <a class="logo" href="index.html"><span class="logo-icon"><img src="icons/icon-192.png" alt="悦动健康"></span>悦动<span class="hl">健康</span></a>
    <div class="nav-actions"><button class="icon-btn" id="themeToggle">🌙</button><button class="icon-btn" onclick="history.back()">←</button></div>
  </div>
</nav>
<header class="page-hero">
  <div class="container">
    <h1>🏅 我的成就</h1>
    <p>每一步坚持，都值得被记录</p>
  </div>
</header>
<section class="section-sm">
  <div class="container">
    <div class="card text-center mb-3" style="background:linear-gradient(135deg,rgba(59,130,246,.08),rgba(139,92,246,.08))">
      <div class="ach-overview">
        <div style="font-size:3rem" id="achBigIcon">🏅</div>
        <div style="font-size:2rem;font-weight:900" id="achCount">0 / 13</div>
        <div class="muted small">已解锁成就</div>
      </div>
    </div>
    <div class="ach-grid" id="achGrid"></div>
  </div>
</section>
<script src="assets/js/storage.js?v=49"></script>
<script src="assets/js/data.js?v=49"></script>
<script src="assets/js/supabase-config.js?v=49"></script>
<script src="assets/js/app.js?v=49"></script>
<script>
(function () {
  'use strict';
  var YDJK = window.YDJK;
  function activeDays() {
    var all = YDJK.getCheckins();
    return Object.keys(all).filter(function (d) {
      var c = all[d];
      return c && ((c.types && c.types.length) || c.plan || (c.minutes && c.minutes > 0));
    }).sort();
  }
  function maxStreak(days) {
    if (!days.length) return 0;
    var best = 1, cur = 1;
    for (var i = 1; i < days.length; i++) {
      if (YDJK.addDays(days[i - 1], 1) === days[i]) cur++; else cur = 1;
      if (cur > best) best = cur;
    }
    return best;
  }
  function totalMealCount() {
    var n = 0;
    for (var i = 0; i < localStorage.length; i++) {
      var k = localStorage.key(i);
      if (k.indexOf('ydjk:meals:') === 0) { try { n += (JSON.parse(localStorage.getItem(k)) || []).length; } catch (e) {} }
    }
    return n;
  }
  document.addEventListener('DOMContentLoaded', function () {
    var days = activeDays();
    var totalMin = 0;
    var all = YDJK.getCheckins();
    days.forEach(function (d) { totalMin += (all[d].minutes || 0); });
    var mealCount = totalMealCount();
    var ws = YDJK.getWeights();
    var streak = maxStreak(days);
    var defs = [
      { icon: '✅', name: '初次打卡', got: days.length >= 1, desc: '完成第一次运动打卡', tip: '完成一次打卡' },
      { icon: '🔥', name: '连续 3 天', got: streak >= 3, desc: '连续打卡 3 天', tip: streak + '/3 天' },
      { icon: '🌟', name: '连续 7 天', got: streak >= 7, desc: '连续打卡 7 天', tip: streak + '/7 天' },
      { icon: '🏆', name: '连续 14 天', got: streak >= 14, desc: '连续打卡 14 天', tip: streak + '/14 天' },
      { icon: '💎', name: '连续 30 天', got: streak >= 30, desc: '连续打卡 30 天', tip: streak + '/30 天' },
      { icon: '🎖️', name: '打卡 10 次', got: days.length >= 10, desc: '累计打卡 10 次', tip: days.length + '/10 次' },
      { icon: '🥇', name: '打卡 50 次', got: days.length >= 50, desc: '累计打卡 50 次', tip: days.length + '/50 次' },
      { icon: '⏱️', name: '运动 500 分钟', got: totalMin >= 500, desc: '累计运动 500 分钟', tip: totalMin + '/500 分' },
      { icon: '⚡', name: '运动 2000 分钟', got: totalMin >= 2000, desc: '累计运动 2000 分钟', tip: totalMin + '/2000 分' },
      { icon: '⚖️', name: '首次称重', got: ws.length >= 1, desc: '记录第一次体重', tip: ws.length + '/1 次' },
      { icon: '📏', name: '称重 10 次', got: ws.length >= 10, desc: '累计记录体重 10 次', tip: ws.length + '/10 次' },
      { icon: '🍽️', name: '首次记餐', got: mealCount >= 1, desc: '记录第一餐', tip: mealCount + '/1 餐' },
      { icon: '🥗', name: '记餐 50 次', got: mealCount >= 50, desc: '累计记录 50 餐', tip: mealCount + '/50 餐' }
    ];
    var got = defs.filter(function (d) { return d.got; }).length;
    document.getElementById('achCount').textContent = got + ' / ' + defs.length;
    document.getElementById('achBigIcon').textContent = got === defs.length ? '👑' : got > 5 ? '🏆' : '🏅';
    document.getElementById('achGrid').innerHTML = defs.map(function (a) {
      var pct = a.got ? 100 : Math.min(100, Math.round(parseFloat(a.tip.split('/')[0] || 0) / parseFloat(a.tip.split('/')[1] || 1) * 100));
      return '<div class="ach-item' + (a.got ? ' got' : '') + '" title="' + a.desc + '">' +
        '<span class="ach-icon">' + (a.got ? a.icon : '🔒') + '</span>' +
        '<span class="ach-name">' + a.name + '</span>' +
        '<div class="ach-progress"><div class="progress-bar" style="width:' + pct + '%"></div></div>' +
        '<span class="ach-tip">' + (a.got ? '✅ 已解锁' : a.tip) + '</span></div>';
    }).join('');
  });
})();
</script>
</body>
</html>
